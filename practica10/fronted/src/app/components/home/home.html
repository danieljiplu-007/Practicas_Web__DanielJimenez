<div class="container mt-5">

  <h2 class="text-center mb-4 fw-bold text-primary">
    🎮 Catálogo de Videojuegos
  </h2>

  <div class="row">

    <div class="col-md-4 mb-4" *ngFor="let game of games">
      
      <div class="card h-100 shadow-lg border-0 game-card"
           (click)="selectGame(game)">

        <img [src]="game.imagenUrl"
             class="card-img-top"
             alt="Imagen videojuego"
             style="height: 350px; object-fit: cover;">

        <div class="card-body text-center">
          <h5 class="card-title fw-bold">
            {{game.nombre}}
          </h5>

          <p class="badge bg-dark">
            {{game.genero}}
          </p>

          <p class="fs-5 text-success fw-bold">
            ${{game.precio}}
          </p>

          <button class="btn btn-outline-primary btn-sm">
            Ver Detalles
          </button>

        </div>
      </div>

    </div>

  </div>

  <!-- Modal simple -->
  <div *ngIf="selectedGame" class="overlay">
    <div class="modal-content p-4 shadow-lg">
      <h3>{{selectedGame.nombre}}</h3>
      <img [src]="selectedGame.imagenUrl"
           style="width:100%; height:250px; object-fit:cover;">
      <p><strong>Género:</strong> {{selectedGame.genero}}</p>
      <p><strong>Precio:</strong> ${{selectedGame.precio}}</p>

      <button class="btn btn-danger w-100"
              (click)="closeModal()">
        Cerrar
      </button>
    </div>
  </div>

</div>
