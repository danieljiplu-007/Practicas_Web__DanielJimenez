<div class="container mt-5">

  <div class="card shadow-lg p-4">

    <h3 class="text-center text-success mb-4">
      ➕ Agregar Videojuego
    </h3>

    <form (ngSubmit)="onSubmit()" #gameForm="ngForm">

      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text"
               class="form-control"
               name="nombre"
               [(ngModel)]="game.nombre"
               required
               minlength="3"
               #nombre="ngModel">

        <div class="text-danger"
             *ngIf="nombre.invalid && nombre.touched">
          Mínimo 3 caracteres
        </div>
      </div>

      <!-- Genero -->
      <div class="mb-3">
        <label class="form-label">Género</label>
        <input type="text"
               class="form-control"
               name="genero"
               [(ngModel)]="game.genero"
               required>
      </div>

      <!-- Precio -->
      <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number"
               class="form-control"
               name="precio"
               [(ngModel)]="game.precio"
               required
               min="1">
      </div>

      <!-- Imagen -->
      <div class="mb-3">
        <label class="form-label">URL Imagen</label>
        <input type="text"
               class="form-control"
               name="imagenUrl"
               [(ngModel)]="game.imagenUrl"
               required>
      </div>

      <button class="btn btn-success w-100"
              [disabled]="gameForm.invalid">
        Guardar
      </button>

    </form>

  </div>

</div>
