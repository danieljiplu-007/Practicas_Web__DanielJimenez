<div class="admin-productos">

<h1>🍽 Gestión de Platillos</h1>

<div class="form-admin">

<h2>{{modoEdicion ? 'Editar Platillo' : 'Nuevo Platillo'}}</h2>

<div class="form-grid">

<input placeholder="Nombre del platillo" [(ngModel)]="nuevoProducto.nombre">
<input placeholder="Descripción" [(ngModel)]="nuevoProducto.descripcion">
<input type="number" placeholder="Precio" [(ngModel)]="nuevoProducto.precio">

<select [(ngModel)]="nuevoProducto.categoria">
<option value="">Seleccionar categoría</option>
<option *ngFor="let cat of categorias">{{cat}}</option>
</select>

</div>

<br>

<label>
<input type="checkbox" [(ngModel)]="nuevoProducto.popular">
Popular ⭐
</label>

<br><br>

<input type="file" (change)="subirImagen($event)">

<img 
*ngIf="nuevoProducto.imagen"
[src]="nuevoProducto.imagen"
class="preview"
>

<p *ngIf="subiendoImagen">Subiendo imagen...</p>

<hr>

<h3>Ingredientes</h3>

<div class="ingredientes-form">
<input [(ngModel)]="ingrediente" placeholder="Ingrediente">
<button type="button" (click)="agregarIngrediente()">Agregar</button>
</div>

<ul class="lista">
<li *ngFor="let ing of nuevoProducto.ingredientes; let i = index">
{{ing}} <button type="button" (click)="eliminarIngrediente(i)">❌</button>
</li>
</ul>

<hr>

<h3>Extras</h3>

<div class="extras-form">
<input [(ngModel)]="extraNombre" placeholder="Nombre extra">
<input [(ngModel)]="extraPrecio" type="number" placeholder="Precio">
<button type="button" (click)="agregarExtra()">Agregar</button>
</div>

<ul class="lista">
<li *ngFor="let ex of nuevoProducto.extras; let i = index">
{{ex.nombre}} - ${{ex.precio}}
<button type="button" (click)="eliminarExtra(i)">❌</button>
</li>
</ul>

<br>

<button class="btn-guardar" type="button" (click)="guardarProducto()" [disabled]="subiendoImagen">
Guardar
</button>

</div>

<hr>

<input class="buscar" placeholder="Buscar..." [(ngModel)]="busqueda">

<div *ngFor="let cat of categorias">

<h2 class="categoria">{{cat}}</h2>

<div class="menu-admin">

<div class="card-admin"
*ngFor="let p of getProductosFiltrados(cat); trackBy: trackById">

<img [src]="p.imagen || 'assets/menu/placeholder.jpg'">

<h3>{{p.nombre}}</h3>
<p class="descripcion">{{p.descripcion}}</p>
<p class="precio">$ {{p.precio}}</p>

<div class="acciones">
<button type="button" class="editar" (click)="editarProducto(p)">Editar</button>
<button type="button" class="eliminar" (click)="eliminarProducto(p._id!)">Eliminar</button>
</div>

</div>

</div>

</div>

</div>
