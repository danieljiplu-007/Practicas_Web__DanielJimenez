<div class="ventas-container">

<h1>💰 Ventas del restaurante</h1>

<!-- 🔥 GRÁFICA -->
<canvas id="graficaVentas"></canvas>

<br>

<div class="filtros">

<button (click)="cambiarFiltro('hoy')">Hoy</button>
<button (click)="cambiarFiltro('semana')">Semana</button>
<button (click)="cambiarFiltro('mes')">Mes</button>

</div>

<div class="tabla-container">

<table>

<thead>
<tr>
<th>Cliente</th>
<th>Total</th>
<th>Fecha</th>
</tr>
</thead>

<tbody>

<tr *ngFor="let venta of ventas">

<td>{{ venta.cliente }}</td>

<td class="precio">
$ {{ venta.total }}
</td>

<td>{{ venta.fecha | date:'short' }}</td>

</tr>

</tbody>

</table>

</div>

<div class="total-ventas">

<h2>Total vendido</h2>

<h1>$ {{ totalVentas }}</h1>

</div>

</div>
